# Base infrastructure services shared across dev and prod
name: wallet-backend
services:
  wallet-api:
    build: ../../
    command: pnpm run dev
    ports:
      - "${PORT}"
    networks:
      - wallet-backend
    develop:
      watch:
        # Rebuild container image when dependencies change
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml

        # Sync source files instantly without stopping the container
        - action: sync
          path: ../../src
          target: /home/backend/src
          ignore:
            - node_modules/

        # Sync tsconfig changes
        - action: sync
          path: ../../tsconfig.json
          target: /home/backend/tsconfig.json

        # Sync .env changes
        - action: sync
          path: ../../.env
          target: /home/backend/.env
    depends_on:
      shared-database:
        condition: service_healthy
      shared-redis:
        condition: service_healthy
  shared-database:
    image: postgres:16-alpine # use latest official postgres version
    container_name: digital-wallet-postgres
    restart: unless-stopped
    networks:
      - wallet-backend
    volumes:
      - pgdata:/var/lib/postgresql/data # persist data even if container shuts down
      - ./dbinit.sql:/docker-entrypoint-initdb.d/01-dbinit.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql # ← Auto-runs on first boot
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet_backend}
      POSTGRES_USER: ${POSTGRES_USER:-wallet_backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_backend}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_backend -d wallet_backend"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  shared-redis:
    image: "redis:8"
    container_name: digital-wallet-redis
    restart: unless-stopped
    # Enables data persistence (saves DB every 60s if >=1 key changed) and sets a password
    command: redis-server --save 60 1 --loglevel notice --requirepass ${REDIS_PASSWORD:-secretpassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wallet-backend
networks:
  wallet-backend:
    driver: bridge
volumes:
  redis-data:
  pgdata:
